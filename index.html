<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b783ca">
<title>Hoàng Tử Giải Cứu Tấm</title>
<style>
:root{--pink:#e99ac3;--purple:#8560a9;--cream:#fff4df;--ink:#62466c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fce7f1,#e8e1fa);color:var(--ink);font-family:Georgia,serif}
.wrap{width:min(1050px,100%);margin:auto;padding:12px}
header{background:linear-gradient(110deg,#d986b7,#9879c5);color:white;text-align:center;border:4px solid #fff;border-radius:20px;padding:10px;box-shadow:0 5px 14px #73508044}
header .eyebrow{font-size:12px;letter-spacing:2px}
h1{font-size:clamp(23px,5vw,36px);margin:3px;text-shadow:1px 3px #87558f}
header p{margin:3px;font-size:13px}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{background:#fff;border:2px solid #e8bbd7;border-radius:12px;padding:7px 12px;font-weight:bold}
.stage-shell{background:#fff;padding:6px;border-radius:18px;box-shadow:0 5px 16px #76508044}
.stage-image{position:relative;width:100%;aspect-ratio:1.5;background:#c7d7ee center/cover no-repeat;border-radius:13px;overflow:hidden}
.stage-image.wide{aspect-ratio:2.15}
.stage-label{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:90%;width:max-content;text-align:center;background:#fff0d9eF;border:2px solid #e6b5ce;border-radius:13px;padding:7px 14px;box-shadow:0 3px 8px #51355c44}
.stage-label strong{display:block;font-size:clamp(15px,3vw,21px)}
.stage-label small{font-size:12px}
.controls{display:flex;justify-content:space-between;gap:8px;margin:10px 0}
.control{border:2px solid #fff;background:linear-gradient(#b99ad8,#7956a8);color:white;border-radius:50%;width:55px;height:55px;font-size:24px;box-shadow:0 3px 7px #58376c55}
.control:active{transform:scale(.94)}
.control-group{display:flex;gap:8px}
.panel{background:#fff;border:2px solid #e6b4d3;border-radius:16px;padding:13px;margin-top:10px;box-shadow:0 3px 9px #79547a1c}
.panel h2{font-size:18px;color:#965c98;margin:0 0 8px}
.question{font-size:16px;line-height:1.5}
.answer-row{display:flex;gap:8px;margin-top:10px}
input{min-width:0;flex:1;padding:12px;border:2px solid #dfb9d8;border-radius:10px;font-size:16px}
.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--purple);color:white;font-weight:bold}
.btn.pink{background:#df83b3}.btn.gold{background:#d9a34a;color:#513a24}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{display:none;background:#fff5d9;border:2px dashed #d8b45d;border-radius:11px;padding:10px;margin-top:10px;line-height:1.45}
.feedback{min-height:24px;margin-top:8px;font-weight:bold}
.inventory{display:flex;gap:8px;flex-wrap:wrap}
.item{background:#fff0f7;border:1px solid #e3b0d0;border-radius:10px;padding:8px 10px}
footer{text-align:center;padding:15px;font-size:12px}
@media(max-width:520px){.wrap{padding:8px}.stage-image{aspect-ratio:1.2}.stage-image.wide{aspect-ratio:1.2}.control{width:48px;height:48px}.answer-row{flex-wrap:wrap}.answer-row input{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="eyebrow">✦ CỔ TÍCH PHIÊU LƯU ✦</div>
 <h1>Hoàng Tử Giải Cứu Tấm</h1>
 <p>Một hành trình cổ tích đầy bí mật</p>
</header>
<div class="stats">
 <div class="stat">❤️ 100/100</div>
 <div class="stat">⭐ <span id="stars">0</span></div>
 <div class="stat">🏅 <span id="medals">0</span>/5</div>
 <div class="stat">Màn <span id="stageNo">1</span>/5</div>
</div>
<div class="stage-shell">
 <div class="stage-image" id="scene">
  <div class="stage-label"><strong id="stageTitle">Màn 1: Ngôi làng</strong><small id="mission">Tìm chiếc chìa khóa bí mật!</small></div>
 </div>
</div>
<div class="controls">
 <div class="control-group">
  <button class="control" aria-label="Sang trái" onclick="move(-1)">◀</button>
  <button class="control" aria-label="Sang phải" onclick="move(1)">▶</button>
 </div>
 <button class="control" aria-label="Nhảy" onclick="jump()">⬆</button>
</div>
<section class="panel">
 <h2>📜 Thử thách của màn</h2>
 <div class="question" id="question"></div>
 <div class="answer-row">
  <input id="answer" autocomplete="off" placeholder="Nhập đáp án...">
  <button class="btn pink" onclick="checkAnswer()">Trả lời</button>
 </div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="actions">
  <button class="btn gold" onclick="showHint()">💡 Gợi ý</button>
  <button class="btn" onclick="hideHint()">Ẩn gợi ý</button>
  <button class="btn" onclick="resetGame()">Chơi lại</button>
 </div>
 <div class="hint" id="hint"></div>
</section>
<section class="panel">
 <h2>🎒 Túi đồ</h2>
 <div class="inventory" id="inventory">🌸 Hoa · 🗝️ Chìa khóa · 🍎 Táo · 📜 Cuộn giấy</div>
</section>
<footer>Tiến trình được lưu trên thiết bị này khi bạn hoàn thành mỗi màn.</footer>
</div>
<script>
const stages=[
 {title:"Màn 1: Ngôi làng",mission:"Tìm chiếc chìa khóa bí mật!",image:"assets/man1.jpg",
  question:"Một mã khóa gồm 3 chữ số. Chữ số hàng đơn vị gấp đôi hàng trăm; hàng chục hơn hàng trăm 1; tổng ba chữ số là 13. Mã khóa là gì?",
  answers:["346"],hints:["Gọi chữ số hàng trăm là x.","Ba chữ số lần lượt là x, x + 1 và 2x. Hãy lập phương trình tổng."] ,item:"🗝️ Chìa khóa cổ"},
 {title:"Màn 2: Khu rừng bí ẩn",mission:"Giải mật mã để tìm đường!",image:"assets/man2.jpg",
  question:"Tìm số tiếp theo trong dãy: 2, 6, 12, 20, 30, ...",
  answers:["42"],hints:["Tính hiệu giữa hai số liên tiếp.","Các hiệu là 4, 6, 8, 10..."],item:"💎 Pha lê rừng"},
 {title:"Màn 3: Nhà mẹ kế",mission:"Tìm manh mối trong căn nhà!",image:"assets/man3.jpg",
  question:"Có 4 người trong phòng. Mỗi người bắt tay với tất cả những người còn lại đúng một lần. Có tất cả bao nhiêu cái bắt tay?",
  answers:["6"],hints:["Mỗi người có thể bắt tay với 3 người còn lại.","Đừng đếm mỗi cái bắt tay hai lần."],item:"📜 Trang nhật ký"},
 {title:"Màn 4: Cung điện bí mật",mission:"Giải câu đố để mở cánh cổng!",image:"assets/man4.jpg",
  question:"Có 3 hộp A, B, C; chỉ một hộp có ngọc. A ghi: “Ngọc không ở đây”. B ghi: “Ngọc ở hộp A”. C ghi: “Ngọc không ở hộp B”. Chỉ một câu đúng. Ngọc ở hộp nào?",
  answers:["b","hộp b","hop b"],hints:["Thử giả sử viên ngọc ở từng hộp.","Đếm số câu đúng trong từng trường hợp."],item:"👑 Ngọc hoàng gia"},
 {title:"Màn 5: Giải cứu Tấm",mission:"Hoàn thành thử thách cuối cùng!",image:"assets/man5.jpg",
  question:"Một người đi từ làng đến cung điện. Ngày đầu đi một nửa quãng đường còn lại và thêm 2 km. Ngày thứ hai cũng đi một nửa quãng đường còn lại và thêm 2 km. Cuối cùng còn 4 km. Quãng đường ban đầu dài bao nhiêu km?",
  answers:["28","28 km"],hints:["Tính ngược từ 4 km ở cuối ngày thứ hai.","Trước ngày thứ hai: 2 × (4 + 2). Tiếp tục tính ngược thêm một ngày."],item:"🌸 Tấm được giải cứu"}
];
let current=0,stars=0,done=[],hintStep=0,movePos=12;
const $=id=>document.getElementById(id);
function normal(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function render(){
 const s=stages[current];
 $("scene").style.backgroundImage=`url("${s.image}")`;
 $("scene").classList.toggle("wide",current===4);
 $("stageTitle").textContent=s.title;$("mission").textContent=s.mission;
 $("question").textContent=s.question;$("stageNo").textContent=current+1;
 $("stars").textContent=stars;$("medals").textContent=done.length;
 $("answer").value="";$("feedback").textContent="";$("hint").style.display="none";
 hintStep=0;movePos=12;
}
function move(direction){
 movePos=Math.max(0,Math.min(85,movePos+direction*5));
 $("scene").style.backgroundPosition=`${movePos}% center`;
}
function jump(){
 $("scene").animate([{transform:"translateY(0)"},{transform:"translateY(-8px)"},{transform:"translateY(0)"}],{duration:350});
}
function showHint(){
 const h=stages[current].hints;
 $("hint").style.display="block";
 $("hint").textContent=hintStep<h.length?"Gợi ý "+(hintStep+1)+": "+h[hintStep++]:"Bạn đã xem hết gợi ý. Hãy tự tìm lời giải nhé!";
}
function hideHint(){$("hint").style.display="none"}
function checkAnswer(){
 const v=normal($("answer").value);
 if(!v){$("feedback").textContent="Bạn nhập đáp án trước nhé!";return}
 if(!stages[current].answers.includes(v)){
  $("feedback").textContent="Chưa chính xác. Hãy thử lại hoặc xem gợi ý nhé!";
  return;
 }
 if(!done.includes(current)){done.push(current);stars+=10}
 $("feedback").textContent="Chính xác! Bạn đã vượt qua thử thách ✨";
 $("stars").textContent=stars;$("medals").textContent=done.length;
 $("inventory").textContent=stages.slice(0,current+1).filter((_,i)=>done.includes(i)).map(s=>s.item).join(" · ")||"🌸 Hoa · 🗝️ Chìa khóa · 🍎 Táo · 📜 Cuộn giấy";
 save();
 setTimeout(()=>{
  if(current<4){current++;save();render()}
  else{
   $("stageTitle").textContent="Chúc mừng!";
   $("mission").textContent="Bạn đã giải cứu được Tấm!";
   $("question").textContent="Bạn đã hoàn thành cả 5 thử thách. Cảm ơn bạn đã chơi! 🌷";
   $("answer").disabled=true;
   $("feedback").textContent="🏆 CHIẾN THẮNG!";
  }
 },900);
}
function save(){localStorage.setItem("ngoc-thao-thu-save",JSON.stringify({current,stars,done}))}
function resetGame(){
 if(!confirm("Bạn muốn chơi lại từ đầu?"))return;
 current=0;stars=0;done=[];$("answer").disabled=false;
 localStorage.removeItem("ngoc-thao-thu-save");$("inventory").textContent="🌸 Hoa · 🗝️ Chìa khóa · 🍎 Táo · 📜 Cuộn giấy";render();
}
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
try{
 const saved=JSON.parse(localStorage.getItem("ngoc-thao-thu-save"));
 if(saved){current=Math.min(4,Math.max(0,saved.current||0));stars=saved.stars||0;done=Array.isArray(saved.done)?saved.done:[]}
}catch(e){}
render();
</script>
</body>
</html>
