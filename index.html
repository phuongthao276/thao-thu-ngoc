
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoàng Tử Giải Cứu Tấm</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fce4ec;
 color:#63334b;
 text-align:center;
}
header{
 background:#f8bbd0;
 padding:12px;
}
h1{font-size:23px}
#game{
 min-height:85vh;
 padding:15px;
 background-size:cover;
 background-position:center;
 background-repeat:no-repeat;
}
.panel{
 background:rgba(255,245,250,.94);
 padding:18px;
 border-radius:18px;
 max-width:480px;
 margin:15px auto;
}
button{
 background:#ec78a5;
 color:white;
 border:0;
 padding:12px 17px;
 border-radius:12px;
 margin:5px;
 font-size:16px;
}
input{
 padding:12px;
 width:90%;
 border:2px solid #ed9abb;
 border-radius:10px;
 font-size:17px;
}
#controls button{font-size:23px}
#player{font-size:30px}
</style>
</head>
<body>

<header>
<h1>👑 HOÀNG TỬ GIẢI CỨU TẤM 👑</h1>
<p>Giải câu đố để thu thập chìa khóa!</p>
</header>

<div id="game">
 <div class="panel">
  <h2 id="stage"></h2>
  <p id="story"></p>
  <h3 id="question"></h3>

  <input id="answer" placeholder="Nhập đáp án...">
  <br>
  <button onclick="checkAnswer()">Kiểm tra</button>
  <button onclick="hint()">Gợi ý 💡</button>

  <p id="result"></p>
  <p id="status">🔑 Chìa khóa: 0/5</p>
  <button onclick="nextStage()">Sang màn tiếp ➜</button>
 </div>

 <div class="panel" id="controls">
  <p>🎮 Điều khiển nhân vật</p>
  <button onclick="move('⬅️')">⬅️</button>
  <button onclick="move('⬆️')">⬆️</button>
  <button onclick="move('⬇️')">⬇️</button>
  <button onclick="move('➡️')">➡️</button>
  <p id="player">🧍</p>
 </div>
</div>

<script>
const stages=[
{
name:"Màn 1: Ngôi làng",
story:"Người bán hàng có 12 quả táo. Bán một nửa rồi được tặng thêm 3 quả.",
question:"Người bán hàng còn bao nhiêu quả táo?",
answer:"9",
hint:"Lấy 12 chia 2 rồi cộng 3."
},
{
name:"Màn 2: Khu rừng bí ẩn",
story:"Có 3 chiếc hộp A, B, C. Chỉ một hộp có chìa khóa. A nói chìa khóa ở B. B nói chìa khóa không ở B. C nói chìa khóa không ở A. Chỉ một câu đúng.",
question:"Chìa khóa nằm ở hộp nào?",
answer:"A",
hint:"Thử từng hộp và đếm số câu đúng."
},
{
name:"Màn 3: Nhà mẹ kế",
story:"Mật mã A=1, B=2, C=3,...",
question:"Giải mã: 20 - 1 - 13",
answer:"TAM",
hint:"Đổi từng số thành chữ cái."
},
{
name:"Màn 4: Cung điện bí mật",
story:"Đồng hồ đang chỉ 3 giờ. Sau 100 giờ nữa, đồng hồ chỉ mấy giờ?",
question:"Nhập số giờ từ 1 đến 12.",
answer:"7",
hint:"100 chia 12 lấy số dư rồi cộng 3."
},
{
name:"Màn 5: Giải cứu Tấm",
story:"Hãy tìm quy luật của dãy số: 2, 6, 12, 20, 30,...",
question:"Số tiếp theo là bao nhiêu?",
answer:"42",
hint:"Mỗi số được tạo bằng cách nhân hai số tự nhiên liên tiếp."
}
];

let current=0;
let unlocked=0;
let solved=false;

function showStage(){
 const s=stages[current];

 document.getElementById("stage").innerText=s.name;
 document.getElementById("story").innerText=s.story;
 document.getElementById("question").innerText=s.question;
 document.getElementById("answer").value="";
 document.getElementById("result").innerText="";
 document.getElementById("status").innerText=
 "🔑 Chìa khóa: "+unlocked+"/5";

 document.getElementById("game").style.backgroundImage=
 "url('assets/man"+(current+1)+".jpg')";

 solved=false;
}

function checkAnswer(){
 const a=document.getElementById("answer").value.trim().toUpperCase();

 if(a===stages[current].answer){
  document.getElementById("result").innerText=
  "🎉 Chính xác! Bạn nhận được chìa khóa!";

  if(!solved){
   unlocked++;
   solved=true;
  }

  document.getElementById("status").innerText=
  "🔑 Chìa khóa: "+unlocked+"/5";
 }else{
  document.getElementById("result").innerText=
  "❌ Chưa đúng! Hãy thử lại nhé.";
 }
}

function hint(){
 document.getElementById("result").innerText=
 "💡 "+stages[current].hint;
}

function nextStage(){
 if(!solved){
  alert("Hãy giải đúng câu đố để lấy chìa khóa!");
  return;
 }

 if(current<4){
  current++;
  showStage();
 }else{
  document.getElementById("game").innerHTML=
  "<div class='panel'><h1>🎉 CHIẾN THẮNG!</h1><h2>Bạn đã giải cứu Tấm!</h2>👑💗</div>";
 }
}

function move(direction){
 document.getElementById("player").innerText=
 "🧍 "+direction;
}

showStage();
</script>
</body>
</html>
